name: Publish Arduino board package
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: board-package-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch previous index if a release already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p tmp
          if gh release list --json tagName --jq '.[].tagName' | grep -q .; then
            gh release download --pattern 'package_elegoo_esp32*_index.json' --dir tmp
          fi
      - name: Build pinned core and package index
        env:
          BOARD_REPOSITORY: ${{ github.repository }}
          BOARD_TAG: ${{ github.ref_name }}
        run: |
          version="${BOARD_TAG#v}"
          previous=()
          if [ -f tmp/package_elegoo_esp32_index.json ]; then
            previous=(--previous-index tmp/package_elegoo_esp32_index.json)
          elif [ -f tmp/package_elegoo_esp32c6_index.json ]; then
            previous=(--previous-index tmp/package_elegoo_esp32c6_index.json)
          fi
          python scripts/build_package.py --repository "$BOARD_REPOSITORY" --version "$version" "${previous[@]}"
      - uses: arduino/setup-arduino-cli@v2
      - name: Compile board example before publishing
        run: python scripts/verify_package.py --compile
      - name: Publish immutable archive and stable index URL
        env:
          GH_TOKEN: ${{ github.token }}
          BOARD_TAG: ${{ github.ref_name }}
        run: |
          cp dist/install-url.txt tmp/release-notes.txt
          gh release create "$BOARD_TAG" dist/*.zip dist/package_elegoo_esp32*_index.json dist/SHA256SUMS --latest --title "ELEGOO-ESP32 $BOARD_TAG" --notes-file tmp/release-notes.txt
